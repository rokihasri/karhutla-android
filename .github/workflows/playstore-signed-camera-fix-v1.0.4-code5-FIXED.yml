      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore Play Store upload key
        shell: bash
        env:
          PLAYSTORE_SIGNING_B64: ${{ secrets.PLAYSTORE_SIGNING_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${PLAYSTORE_SIGNING_B64:-}" ]; then
            echo "ERROR: GitHub Secret PLAYSTORE_SIGNING_B64 belum dibuat." >&2
            echo "Buat di Settings > Secrets and variables > Actions > New repository secret." >&2
            exit 1
          fi

          # Terima secret base64 murni maupun teks yang tidak sengaja ikut tercopy.
          SIGNING_B64=$(printf '%s\n' "$PLAYSTORE_SIGNING_B64" \
            | tr -d '\r' \
            | awk 'length($0) > 100 && $0 ~ /^[A-Za-z0-9+\/=]+$/ { if (length($0) > max) { max=length($0); best=$0 } } END { print best }')

          if [ -z "$SIGNING_B64" ]; then
            echo "ERROR: Secret tidak berisi data signing Base64 yang valid." >&2
            exit 1
          fi

          printf '%s' "$SIGNING_B64" | base64 --decode > /tmp/respon-signing.zip
          unzip -tq /tmp/respon-signing.zip >/dev/null || {
            echo "ERROR: Data signing berhasil didecode tetapi bukan ZIP yang valid." >&2
            exit 1
          }

          rm -rf /tmp/respon-signing
          mkdir -p /tmp/respon-signing
          unzip -q /tmp/respon-signing.zip -d /tmp/respon-signing
          chmod 600 /tmp/respon-signing/upload-keystore.jks

          if [ ! -f /tmp/respon-signing/signing.env ]; then
            echo "ERROR: signing.env tidak ditemukan di secret signing." >&2
            exit 1
          fi

          source /tmp/respon-signing/signing.env
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "::add-mask::$KEY_ALIAS"
          {
            echo "KEYSTORE_FILE=/tmp/respon-signing/upload-keystore.jks"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$KEY_ALIAS"
            echo "KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Play Store AAB and APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean bundleRelease assembleRelease assembleDebug

      - name: Verify signed AAB
        shell: bash
        run: |
          set -euo pipefail
          jarsigner -verify -certs app/build/outputs/bundle/release/app-release.aab

      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          AAB="app/build/outputs/bundle/release/app-release.aab"
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          test -f "$AAB"
          test -n "$APK"
          test -f "$APK"

          cp "$APK" app-release.apk
          sha256sum "$AAB" > app-release.aab.sha256
          sha256sum app-release.apk > app-release.apk.sha256

      - name: Upload Play Store signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: RESPON-KARHUTLA-PlayStore-AAB-SIGNED
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app-release.aab.sha256

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: RESPON-KARHUTLA-release-APK-SIGNED
          path: |
            app-release.apk
            app-release.apk.sha256

      - name: Upload debug APK
